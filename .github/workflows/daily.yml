name: Daily Script Run

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST daily
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install selenium fpdf2   # add any other packages your script imports

      - name: Run script
        env:
          CRM_USERNAME: ${{ secrets.CRM_USERNAME }}
          CRM_PASSWORD: ${{ secrets.CRM_PASSWORD }}
        run: python "complete code with call log.py"

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: daily-output
          path: "*.pdf"   # adjust to whatever file(s) your script produces
